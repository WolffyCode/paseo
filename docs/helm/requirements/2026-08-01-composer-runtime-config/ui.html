  <script>
    (() => {
      const root = document.getElementById("helm-composer-a-refined");
      if (!root || root.dataset.ready === "true") return;
      root.dataset.ready = "true";

      const composer = root.querySelector(".hc-composer");
      const state = {
        directory: { name: "Helm", path: "/Users/zhuanzmima0000/Desktop/coding/person/Helm" },
        directoryQuery: "",
        provider: "Codex",
        relay: "官方直连",
        model: "GPT-5.6 Sol",
        reasoning: "High",
        mode: "完全访问",
        conversationStarted: false,
        cascadeStep: "model",
        text: "",
        attachments: [],
        queue: [],
        running: false,
        elapsed: 0,
        timer: null,
        voice: false,
        context: 38,
        openPanel: null,
        suggestions: [],
        suggestionIndex: 0,
      };
      const catalog = {
        Codex: {
          官方直连: ["GPT-5.6 Sol", "GPT-5.6 Terra", "GPT-5.4 Mini"],
          公司网关: ["GPT-5.6 Sol", "GPT-5.6 Terra"],
        },
        "Claude Code": {
          官方直连: ["Claude Opus 4.6", "Claude Sonnet 4.6"],
          公司网关: ["Claude Sonnet 4.6"],
        },
        OpenCode: {
          本地服务: ["GPT-5.6", "Claude Sonnet 4.6"],
          公司网关: ["GPT-5.6"],
        },
      };
      const providerModes = {
        Codex: ["默认权限", "自动审查", "完全访问"],
        "Claude Code": ["默认", "规划"],
        OpenCode: ["构建", "规划"],
      };
      const reasonings = ["Low", "Medium", "High", "XHigh", "Max"];
      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      const refreshIcons = () => {
        if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      };
      const canSend = () => Boolean(state.text.trim() || state.attachments.length);
      const panelControls = ["directory", "model", "reasoning", "mode", "usage", "attachment"];

      const iconButton = (icon, label, control, extra = "") =>
        `<button type="button" class="hc-icon-button ${extra}" aria-label="${label}" data-control="${control}" data-tooltip="${label}"><i data-lucide="${icon}" aria-hidden="true"></i></button>`;
      const configClass = (control) => (state.openPanel === control ? "is-open" : "");
      const modelButton = () =>
        `<button type="button" class="hc-config-control hc-model-control ${configClass("model")}" data-control="model" aria-label="模型：${escapeHtml(state.provider)}，${escapeHtml(state.relay)}，${escapeHtml(state.model)}"><small class="hc-model-chain"><span>${escapeHtml(state.provider)}</span><span>·</span><span>${escapeHtml(state.relay)}</span><span>·</span><strong>${escapeHtml(state.model)}</strong></small><i data-lucide="chevron-down" aria-hidden="true"></i></button>`;
      const reasoningButton = () =>
        `<button type="button" class="hc-config-control hc-reasoning-control ${configClass("reasoning")}" data-control="reasoning" aria-label="推理强度：${escapeHtml(state.reasoning)}"><small class="hc-value">${escapeHtml(state.reasoning)}</small><i data-lucide="chevron-down" aria-hidden="true"></i></button>`;
      const modeButton = () =>
        `<button type="button" class="hc-config-control hc-mode-control ${configClass("mode")}" data-control="mode" aria-label="运行模式：${escapeHtml(state.mode)}"><small class="hc-value"><span class="hc-risk-dot"></span>${escapeHtml(state.mode)}</small><i data-lucide="chevron-down" aria-hidden="true"></i></button>`;
      const usageButton = () =>
        `<button type="button" class="hc-config-control hc-context-control ${configClass("usage")}" data-control="usage" aria-label="上下文：${state.context}%"><small>上下文</small><small class="hc-value">${state.context}%</small><i data-lucide="chevron-down" aria-hidden="true"></i></button>`;
      const sendButton = () =>
        `<button type="button" class="hc-send-button ${state.running ? "is-stop" : ""}" data-control="send" aria-label="${state.running ? "停止运行" : "发送"}" ${state.running || canSend() ? "" : "disabled"}><i data-lucide="${state.running ? "square" : "arrow-up"}" aria-hidden="true"></i></button>`;
      const queueButton = () =>
        `<button type="button" class="hc-icon-button" data-control="queue" aria-label="加入待发队列" data-tooltip="加入待发队列" ${state.running && canSend() ? "" : "hidden"}><i data-lucide="list-plus" aria-hidden="true"></i></button>`;
      const directoryButton = () =>
        state.directory
          ? `<button type="button" class="hc-directory" data-control="directory" ${state.conversationStarted ? "disabled" : ""}><span class="hc-folder-mark"><i data-lucide="folder-git-2" aria-hidden="true"></i></span><strong>${escapeHtml(state.directory.name)}</strong><span class="hc-path">${escapeHtml(state.directory.path)}</span><i class="hc-chevron" data-lucide="chevron-down" aria-hidden="true"></i></button>`
          : `<button type="button" class="hc-directory" data-control="directory" ${state.conversationStarted ? "disabled" : ""}><span class="hc-folder-mark"><i data-lucide="message-circle" aria-hidden="true"></i></span><strong>对话</strong><span class="hc-path">未选择工作目录</span><i class="hc-chevron" data-lucide="chevron-down" aria-hidden="true"></i></button>`;
      const runStatus = () =>
        state.running
          ? `<span class="hc-run-state"><span class="hc-run-pulse"><i></i><i></i><i></i></span><span>正在执行</span><time>00:00</time></span>`
          : "";
      const directActions = () =>
        state.voice
          ? `<div class="hc-voice-live"><span class="hc-wave"><i></i><i></i><i></i></span><strong>正在听取</strong><button type="button" data-control="stop-voice" aria-label="停止语音输入"><i data-lucide="square" aria-hidden="true"></i></button></div>`
          : `<span class="hc-action-anchor is-left">${iconButton("plus", "添加附件", "attachment")}${state.openPanel === "attachment" ? attachmentDropdown() : ""}</span>${iconButton("mic", "语音输入", "voice")}`;
      const queueMarkup = () =>
        state.queue.length
          ? `<div class="hc-queue" aria-label="待发队列">${state.queue.map((text, index) => `<div class="hc-queue-row"><span class="hc-queue-index">${index + 1}</span><span class="hc-queue-text">${escapeHtml(text)}</span><button type="button" data-delete-queue="${index}" aria-label="删除待发消息"><i data-lucide="trash-2" aria-hidden="true"></i></button><button type="button" data-send-now="${index}" aria-label="立即发送"><i data-lucide="forward" aria-hidden="true"></i></button></div>`).join("")}</div>`
          : "";
      const attachmentMarkup = () =>
        state.attachments.length
          ? `<div class="hc-attachments" aria-label="附件">${state.attachments.map((item, index) => `<span class="hc-attachment"><i data-lucide="${item.icon}" aria-hidden="true"></i><span>${escapeHtml(item.name)}</span><button type="button" data-remove-attachment="${index}" aria-label="移除 ${escapeHtml(item.name)}"><i data-lucide="x" aria-hidden="true"></i></button></span>`).join("")}</div>`
          : "";
      const suggestionRows = () =>
        state.suggestions
          .map(
            (item, index) =>
              `<button type="button" class="hc-suggestion ${index === state.suggestionIndex ? "is-active" : ""}" data-suggestion="${index}"><i data-lucide="${item.icon}" aria-hidden="true"></i><span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.detail)}</small></span><i data-lucide="corner-down-left" aria-hidden="true"></i></button>`,
          )
          .join("");
      const suggestionMarkup = () =>
        `<div class="hc-suggestions" ${state.suggestions.length ? "" : "hidden"}>${suggestionRows()}</div>`;
      const newConversationStarter = () =>
        state.conversationStarted
          ? ""
          : `<section class="hc-new-conversation-starter"><small>新对话</small><h2>今天想构建点什么？</h2></section>`;

      const renderComposer = (preserveFocus = false) => {
        composer.innerHTML = `<div class="hc-layout ${state.running ? "is-running" : ""} ${canSend() ? "has-draft" : ""} ${state.voice ? "is-voice" : ""}">
          ${newConversationStarter()}
          <div class="hc-context-line"><div class="hc-context-group"><span class="hc-directory-anchor">${directoryButton()}${state.openPanel === "directory" ? directoryDropdown() : ""}</span></div>${runStatus()}</div>
          <section class="hc-input-surface" aria-label="对话输入框">
            ${queueMarkup()}${attachmentMarkup()}
            <div class="hc-editor"><textarea rows="3" aria-label="给 Agent 发消息" placeholder="描述任务，/ 调用命令">${escapeHtml(state.text)}</textarea></div>
            ${suggestionMarkup()}
            <div class="hc-inner-footer"><div class="hc-action-group">${directActions()}</div><div class="hc-action-group">${queueButton()}${sendButton()}</div></div>
          </section>
          <nav class="hc-runtime-dock" aria-label="运行配置"><span class="hc-dock-label"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><small>运行配置</small></span><span class="hc-runtime-divider" aria-hidden="true"></span><div class="hc-runtime-group"><span class="hc-select-anchor hc-model-anchor">${modelButton()}${state.openPanel === "model" ? modelDropdown() : ""}</span><span class="hc-select-anchor hc-reasoning-anchor">${reasoningButton()}${state.openPanel === "reasoning" ? reasoningDropdown() : ""}</span><span class="hc-select-anchor hc-mode-anchor">${modeButton()}${state.openPanel === "mode" ? modeDropdown() : ""}</span><span class="hc-select-anchor hc-usage-anchor">${usageButton()}${state.openPanel === "usage" ? usageDropdown() : ""}</span></div></nav>
        </div>`;
        const textarea = root.querySelector("textarea");
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 180)}px`;
        if (preserveFocus) textarea.focus();
        refreshIcons();
      };

      const closePanel = () => {
        state.openPanel = null;
      };
      const panelHead = (title, subtitle = "") =>
        `<div class="hc-panel-head"><div><strong>${title}</strong>${subtitle ? `<small>${subtitle}</small>` : ""}</div>${iconButton("x", `关闭${title}`, "close-panel", "hc-panel-close")}</div>`;
      const row = (icon, title, detail, attrs, selected = false) =>
        `<button type="button" class="hc-menu-row ${selected ? "is-selected" : ""}" ${attrs}><span class="hc-row-icon"><i data-lucide="${icon}" aria-hidden="true"></i></span><span class="hc-row-copy"><strong>${escapeHtml(title)}</strong><small>${escapeHtml(detail)}</small></span>${selected ? '<i data-lucide="check" aria-hidden="true"></i>' : ""}</button>`;
      const selectRow = (title, attrs, selected = false) =>
        `<button type="button" class="hc-select-row ${selected ? "is-selected" : ""}" ${attrs}><span>${escapeHtml(title)}</span>${selected ? '<i data-lucide="check" aria-hidden="true"></i>' : ""}</button>`;
      const cascadePath = () => {
        const providerLocked = state.conversationStarted;
        return `<div class="hc-cascade-path">
          <button type="button" data-cascade-step="provider" class="${state.cascadeStep === "provider" ? "is-current" : ""}" ${providerLocked ? "disabled" : ""}>${providerLocked ? '<i data-lucide="lock" aria-hidden="true"></i>' : ""}${escapeHtml(state.provider)}</button>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
          <button type="button" data-cascade-step="relay" class="${state.cascadeStep === "relay" ? "is-current" : ""}">${escapeHtml(state.relay)}</button>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
          <button type="button" data-cascade-step="model" class="${state.cascadeStep === "model" ? "is-current" : ""}">${escapeHtml(state.model)}</button>
        </div>`;
      };
      const modelDropdown = () => {
        const step = state.cascadeStep;
        const titles = { provider: "选择提供方", relay: "选择中转站", model: "选择模型" };
        let rows = "";
        if (step === "provider") {
          rows = Object.keys(catalog)
            .map((name) =>
              row(
                "bot",
                name,
                "Agent 提供方",
                `data-provider-choice="${escapeHtml(name)}"`,
                name === state.provider,
              ),
            )
            .join("");
        } else if (step === "relay") {
          rows = Object.keys(catalog[state.provider])
            .map((name) =>
              row(
                "network",
                name,
                `${state.provider} 中转站`,
                `data-relay-choice="${escapeHtml(name)}"`,
                name === state.relay,
              ),
            )
            .join("");
        } else {
          rows = catalog[state.provider][state.relay]
            .map((name) =>
              row(
                "sparkles",
                name,
                name.includes("Sol") || name.includes("Opus")
                  ? "复杂编码与长任务"
                  : "日常编码与快速迭代",
                `data-model-choice="${escapeHtml(name)}"`,
                name === state.model,
              ),
            )
            .join("");
        }
        return `<div class="hc-dropdown">${cascadePath()}<div class="hc-cascade-title"><strong>${titles[step]}</strong>${state.conversationStarted ? '<span class="hc-locked-provider"><i data-lucide="lock" aria-hidden="true"></i>提供方已锁定</span>' : ""}</div><div class="hc-menu-list">${rows}</div></div>`;
      };
      const reasoningDropdown = () =>
        `<div class="hc-dropdown"><div class="hc-cascade-title"><strong>模型强度</strong><span>${escapeHtml(state.model)}</span></div><div class="hc-compact-list">${reasonings.map((name) => selectRow(name, `data-reasoning="${name}"`, name === state.reasoning)).join("")}</div></div>`;
      const modeDropdown = () =>
        `<div class="hc-dropdown"><div class="hc-cascade-title"><strong>运行模式</strong><span>${escapeHtml(state.model)}</span></div><div class="hc-compact-list">${providerModes[state.provider].map((name) => selectRow(name, `data-mode="${escapeHtml(name)}"`, name === state.mode)).join("")}</div></div>`;
      const directoryProjects = [
        { name: "Helm", path: "/Users/zhuanzmima0000/Desktop/coding/person/Helm" },
        { name: "Skill Graph", path: "/Users/zhuanzmima0000/Desktop/coding/company/skill-graph" },
        { name: "Yoncode Tool", path: "/Users/zhuanzmima0000/Desktop/coding/company/Yoncode Tool" },
      ];
      const projectDirectoryPanel = () => {
        const query = state.directoryQuery.trim().toLocaleLowerCase();
        const filteredProjects = directoryProjects.filter((project) =>
          `${project.name} ${project.path}`.toLocaleLowerCase().includes(query),
        );
        const rows = filteredProjects
          .map((project) =>
            row(
              "folder-git-2",
              project.name,
              project.path,
              `data-directory="${escapeHtml(project.name)}" data-path="${escapeHtml(project.path)}"`,
              state.directory?.path === project.path,
            ),
          )
          .join("");
        return `<label class="hc-directory-search"><i data-lucide="search" aria-hidden="true"></i><input data-directory-search type="search" aria-label="搜索项目" value="${escapeHtml(state.directoryQuery)}" placeholder="搜索项目" autocomplete="off" /></label><div class="hc-menu-list">${rows || '<div class="hc-empty">没有匹配的项目</div>'}</div>`;
      };
      const directoryDropdown = () =>
        `<div class="hc-dropdown"><div class="hc-panel-head"><div><strong>选择工作目录</strong></div></div>${projectDirectoryPanel()}<div class="hc-panel-foot"><button type="button" class="hc-panel-text" data-filesystem-directory><i data-lucide="folder-tree" aria-hidden="true"></i>浏览文件系统…</button><button type="button" class="hc-panel-text" data-control="clear-directory"><i data-lucide="message-circle" aria-hidden="true"></i>不使用工作目录</button></div></div>`;
      const attachmentDropdown = () =>
        `<div class="hc-dropdown">${panelHead("添加附件")}<div class="hc-compact-list">${selectRow("添加图片", 'data-panel-action="image"')}${selectRow("添加文件", 'data-panel-action="file"')}${selectRow("截取画布区域", 'data-panel-action="capture"')}</div></div>`;
      const usageDropdown = () =>
        `<div class="hc-dropdown">${panelHead("上下文与额度", `${state.provider} · ${state.relay}`)}<div class="hc-usage-block"><div class="hc-usage-label"><span>对话上下文</span><strong>72k / 190k</strong></div><div class="hc-meter"><span style="width:${state.context}%"></span></div></div><div class="hc-usage-block"><div class="hc-usage-label"><span>5 小时额度</span><strong>64%</strong></div><div class="hc-meter is-warn"><span style="width:64%"></span></div><small>1 小时 42 分钟后重置</small></div></div>`;
      const defaultCascadeStep = () =>
        !state.provider ? "provider" : !state.relay ? "relay" : "model";
      const togglePanel = (type) => {
        if (state.openPanel === type) {
          state.openPanel = null;
        } else {
          state.openPanel = type;
          if (type === "model") state.cascadeStep = defaultCascadeStep();
        }
        renderComposer();
      };

      const updateSuggestions = () => {
        const textarea = root.querySelector("textarea");
        state.text = textarea.value;
        const slash = state.text.match(/(?:^|\s)\/([\w-]*)$/);
        const options = slash
          ? [
              { icon: "scan-search", value: "/review", label: "/review", detail: "审查当前改动" },
              { icon: "flask-conical", value: "/test", label: "/test", detail: "运行相关测试" },
              {
                icon: "message-circle-question",
                value: "/explain",
                label: "/explain",
                detail: "解释选中代码",
              },
            ]
          : [];
        const query = (slash?.[1] || "").toLowerCase();
        state.suggestions = options.filter((item) =>
          `${item.label} ${item.detail}`.toLowerCase().includes(query),
        );
        state.suggestionIndex = Math.min(
          state.suggestionIndex,
          Math.max(0, state.suggestions.length - 1),
        );
        const suggestionBox = root.querySelector(".hc-suggestions");
        suggestionBox.hidden = state.suggestions.length === 0;
        suggestionBox.innerHTML = suggestionRows();
        const send = root.querySelector('[data-control="send"]');
        if (!state.running) send.disabled = !canSend();
        const queueSend = root.querySelector('[data-control="queue"]');
        queueSend.hidden = !(state.running && canSend());
        root.querySelector(".hc-layout").classList.toggle("has-draft", canSend());
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 180)}px`;
        refreshIcons();
      };
      const chooseSuggestion = (index) => {
        const item = state.suggestions[index];
        if (!item) return;
        state.text = state.text.replace(
          /(?:^|\s)\/[\w-]*$/,
          (match) => `${match.startsWith(" ") ? " " : ""}${item.value} `,
        );
        state.suggestions = [];
        const textarea = root.querySelector("textarea");
        textarea.value = state.text;
        const suggestionBox = root.querySelector(".hc-suggestions");
        suggestionBox.hidden = true;
        suggestionBox.innerHTML = "";
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 180)}px`;
        textarea.focus();
      };
      const beginRun = () => {
        state.running = true;
        state.conversationStarted = true;
        state.elapsed = 0;
        if (state.timer) window.clearInterval(state.timer);
        state.timer = window.setInterval(() => {
          state.elapsed += 1;
          const time = root.querySelector(".hc-run-state time");
          if (time)
            time.textContent = `${String(Math.floor(state.elapsed / 60)).padStart(2, "0")}:${String(state.elapsed % 60).padStart(2, "0")}`;
        }, 1000);
        closePanel();
        renderComposer();
      };
      const startRun = () => {
        if (!canSend()) return;
        state.text = "";
        state.attachments = [];
        beginRun();
      };
      const stopRun = () => {
        state.running = false;
        if (state.timer) window.clearInterval(state.timer);
        state.timer = null;
        renderComposer();
      };
      const addQueue = () => {
        if (!canSend()) return;
        state.queue.push(
          state.text.trim() || state.attachments.map((item) => item.name).join("、"),
        );
        state.text = "";
        state.attachments = [];
        renderComposer();
      };

      root.addEventListener("click", (event) => {
        const control = event.target.closest("[data-control]")?.dataset.control;
        if (control === "close-panel") {
          closePanel();
          renderComposer();
          return;
        }
        if (panelControls.includes(control)) {
          togglePanel(control);
          return;
        }
        if (control === "voice") {
          state.voice = true;
          renderComposer();
          return;
        }
        if (control === "stop-voice") {
          state.voice = false;
          state.text += `${state.text ? " " : ""}再检查一遍交互细节和异常状态`;
          renderComposer(true);
          return;
        }
        if (control === "send") {
          state.running ? stopRun() : startRun();
          return;
        }
        if (control === "queue") {
          addQueue();
          return;
        }
        if (control === "clear-directory") {
          state.directory = null;
          closePanel();
          renderComposer(true);
          return;
        }

        if (event.target.closest("[data-filesystem-directory]")) {
          window.location.href = "../2026-08-03-filesystem-picker-design/ui.html";
          return;
        }

        const directory = event.target.closest("[data-directory]");
        if (directory) {
          state.directory = { name: directory.dataset.directory, path: directory.dataset.path };
          closePanel();
          renderComposer();
          return;
        }
        const cascadeStep = event.target.closest("[data-cascade-step]");
        if (
          cascadeStep &&
          !(cascadeStep.dataset.cascadeStep === "provider" && state.conversationStarted)
        ) {
          state.cascadeStep = cascadeStep.dataset.cascadeStep;
          renderComposer();
          return;
        }
        const provider = event.target.closest("[data-provider-choice]");
        if (provider && !state.conversationStarted) {
          state.provider = provider.dataset.providerChoice;
          state.relay = Object.keys(catalog[state.provider])[0];
          state.model = catalog[state.provider][state.relay][0];
          state.mode = providerModes[state.provider][0];
          state.cascadeStep = "relay";
          renderComposer();
          return;
        }
        const relay = event.target.closest("[data-relay-choice]");
        if (relay) {
          state.relay = relay.dataset.relayChoice;
          state.model = catalog[state.provider][state.relay][0];
          state.cascadeStep = "model";
          renderComposer();
          return;
        }
        const model = event.target.closest("[data-model-choice]");
        if (model) {
          state.model = model.dataset.modelChoice;
          closePanel();
          renderComposer();
          return;
        }
        const reasoning = event.target.closest("[data-reasoning]");
        if (reasoning) {
          state.reasoning = reasoning.dataset.reasoning;
          closePanel();
          renderComposer();
          return;
        }
        const mode = event.target.closest("[data-mode]");
        if (mode) {
          state.mode = mode.dataset.mode;
          closePanel();
          renderComposer();
          return;
        }
        const panelAction = event.target.closest("[data-panel-action]")?.dataset.panelAction;
        if (panelAction) {
          const names = {
            image: "composer-layout.png",
            file: "interaction-notes.md",
            capture: "canvas-capture.png",
          };
          state.attachments.push({
            name: names[panelAction],
            icon: panelAction === "file" ? "file-text" : "image",
          });
          closePanel();
          renderComposer();
          return;
        }
        const remove = event.target.closest("[data-remove-attachment]");
        if (remove) {
          state.attachments.splice(Number(remove.dataset.removeAttachment), 1);
          renderComposer();
          return;
        }
        const deleteQueue = event.target.closest("[data-delete-queue]");
        if (deleteQueue) {
          state.queue.splice(Number(deleteQueue.dataset.deleteQueue), 1);
          renderComposer();
          return;
        }
        const sendNow = event.target.closest("[data-send-now]");
        if (sendNow) {
          state.queue.splice(Number(sendNow.dataset.sendNow), 1);
          state.running ? renderComposer() : beginRun();
          return;
        }
        const suggestion = event.target.closest("[data-suggestion]");
        if (suggestion) {
          chooseSuggestion(Number(suggestion.dataset.suggestion));
          return;
        }
        if (event.target.closest(".hc-composer") && state.openPanel) {
          closePanel();
          renderComposer();
        }
      });

      root.addEventListener("input", (event) => {
        if (event.target.matches("[data-directory-search]")) {
          state.directoryQuery = event.target.value;
          renderComposer();
          const directorySearch = root.querySelector("[data-directory-search]");
          directorySearch.focus();
          directorySearch.setSelectionRange(
            state.directoryQuery.length,
            state.directoryQuery.length,
          );
          return;
        }
        if (event.target.matches("textarea")) {
          state.suggestionIndex = 0;
          updateSuggestions();
        }
      });
      root.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closePanel();
          state.suggestions = [];
          renderComposer();
          return;
        }
        if (!event.target.matches("textarea")) return;
        if (state.suggestions.length && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
          event.preventDefault();
          state.suggestionIndex =
            (state.suggestionIndex +
              (event.key === "ArrowDown" ? 1 : -1) +
              state.suggestions.length) %
            state.suggestions.length;
          const suggestionBox = root.querySelector(".hc-suggestions");
          suggestionBox.innerHTML = suggestionRows();
          refreshIcons();
          return;
        }
        if (state.suggestions.length && event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          chooseSuggestion(state.suggestionIndex);
          return;
        }
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          state.running ? addQueue() : startRun();
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.composedPath().includes(root) && state.openPanel) {
          closePanel();
          renderComposer();
        }
      });

      renderComposer();
    })();
  </script>
</div>
